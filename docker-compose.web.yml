# Django + FastAPI + Caddy deployment.
# Use: docker compose --env-file web/.env -f docker-compose.web.yml ...
name: beaurette

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      PROJECT_ROOT: /app
      PROJECT_ROOT_PATH: /app
      BM25_INDEX_PATH: /app/data/02_processed/bm25_index.pkl
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: web
    env_file:
      - web/.env
    environment:
      DJANGO_DEBUG: "False"
      AI_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    # Gunicorn is reachable only inside Docker. Caddy is the public entrypoint.
    expose:
      - "8001"
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: proxy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      # Keep the first HTTP check private; change to 0.0.0.0 for domain/HTTPS launch.
      - "${WEB_BIND_IP:-127.0.0.1}:80:80"
      - "${WEB_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
