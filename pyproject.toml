[project]
name = "cosmetic-ad-agent"
version = "0.1.0"
description = "화장품 광고 문구 판정 및 교정 에이전트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain-core>=0.2.35",
    "langchain-openai>=0.1.22",
    "openai>=1.40.0",
    "langgraph>=0.2.14",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmetic_agent"]
