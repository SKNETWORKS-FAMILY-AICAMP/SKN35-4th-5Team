{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>회원가입</h1>
  <form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn">회원가입</button>
  </form>
  <p>이미 계정이 있나요? <a href="{% url 'accounts:login' %}">로그인</a></p>
</section>
{% endblock %}
