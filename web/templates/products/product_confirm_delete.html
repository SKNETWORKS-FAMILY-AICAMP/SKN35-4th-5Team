{% extends "base.html" %}
{% block title %}제품 삭제{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>'{{ product.name }}' 삭제</h1>
  <p>제품과 실증 자료가 삭제됩니다. 검토 이력은 남습니다.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">삭제</button>
    <a class="btn btn-secondary" href="{% url 'products:detail' product.pk %}">취소</a>
  </form>
</section>
{% endblock %}
